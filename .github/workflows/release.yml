# Builds, tests and benchmarks arx for macOS and Linux when a v* tag is
# pushed (a slow or oversized build fails the release), and publishes
# arx-<os>-<arch>.tar.gz (+ .sha256) and install.sh to a GitHub release.
# `arx update` and install.sh download these.
#
# Zig cross-compiles, so the macOS runner also builds darwin-x86_64; the
# tests and budgets run on each runner's own architecture. Linux binaries
# link musl statically. Every job uses the pinned Zig release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ZIG_VERSION: 0.17.0

jobs:
  macos:
    # macos-latest tracks GitHub's current image; macos-14 was retired in
    # November 2026 (https://github.com/actions/runner-images/issues/13518).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Test
        run: make test
      - name: Benchmark (size, startup, memory, reload)
        run: make bench
      - name: Package
        run: |
          for target in darwin-arm64 darwin-x86_64; do
            make clean-bin dist TARGET=$target VERSION=${GITHUB_REF_NAME#v}
          done
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/arx-*.tar.gz*

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Test
        run: make test VERSION=${GITHUB_REF_NAME#v}
      - name: Benchmark (static musl release build)
        run: make bench VERSION=${GITHUB_REF_NAME#v}
      - name: Package
        run: make dist TARGET=${{ matrix.target }} VERSION=${GITHUB_REF_NAME#v}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/arx-*.tar.gz*

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* install.sh \
            --repo "$GITHUB_REPOSITORY" --title "arx $GITHUB_REF_NAME" --generate-notes
