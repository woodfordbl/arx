# Runs on every push to main and every pull request:
#   lint  zig fmt, 400-line files, doc comments
#   test  the Zig unit tests and every end-to-end test against the debug
#         build (safety checks and leak reports on), then the performance
#         budgets against the static Linux (musl) release build: size,
#         startup, memory and reload time
# Releases also test and benchmark on macOS (see release.yml).
# Every job uses the one Zig release arx is pinned to (ZIG_VERSION in the
# Makefile, minimum_zig_version in build.zig.zon).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  ZIG_VERSION: 0.17.0

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Lint
        run: scripts/lint.sh

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Test (unit tests, then end-to-end against the debug build)
        run: make test VERSION=ci
      - name: Benchmark (static musl release build)
        run: make bench VERSION=ci
