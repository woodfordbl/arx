# Runs on every push to main and every pull request:
#   lint  Google style (clang-format 23, cpplint), 400-line files, doc comments
#   test  a static Linux build (Alpine, musl), all tests, then the
#         performance budgets: size, startup, memory and reload time
# Releases also test and benchmark on macOS (see release.yml).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned linters
        run: |
          pipx install clang-format==23.1.3
          pipx install cpplint==2.0.2
      - name: Lint
        run: scripts/lint.sh

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and benchmark (static musl, in Alpine)
        run: |
          docker run --rm -v "$PWD":/w -w /w alpine:3.20 sh -c '
            apk add -q build-base bash python3 curl jq git &&
            make all CC="gcc -static" VERSION=ci &&
            ARX=./arx tests/run.sh && ARX=./arx tests/plugins.sh &&
            ARX=./arx tests/layers.sh && ARX=./arx tests/cli.sh &&
            ARX=./arx tests/climb.sh && ARX=./arx tests/climb-run.sh &&
            ARX=./arx tests/ui.sh &&
            tests/bench.sh'
