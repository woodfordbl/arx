# cpplint (Google's style checker) settings for the C sources.
set noparent
linelength=80
extensions=c,h
headers=h
# C has only C-style casts; the project has no license header yet.
# include_what_you_use asks for C++ headers (<cstdio>, <string>); not C.
filter=-readability/casting,-legal/copyright,-build/include_what_you_use
exclude_files=vendor
